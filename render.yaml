# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Stands up all three pieces of the app in one go: a free Postgres database, the
# FastAPI backend (built from backend/Dockerfile), and the frontend as a static site
# (Render runs `npm run build` itself, so VITE_API_BASE_URL just works as a normal
# build-time env var exactly like it does locally — no extra Docker/nginx layer for
# the frontend).
#
# One-time manual step: GROQ_API_KEY is `sync: false` below, meaning Render will
# prompt you to paste it in yourself during blueprint setup rather than reading it
# from this file — it never gets committed to the repo.
#
# IMPORTANT: CORS_ORIGINS and VITE_API_BASE_URL below must be the REAL assigned
# *.onrender.com URLs, not guesses — Render re-syncs `value:`-type env vars from
# this file on every blueprint deploy (push to the connected branch), which will
# silently overwrite any manual fix made in the dashboard. If either service's name
# gets a random suffix appended (because the plain name was already taken by another
# Render user — onrender.com subdomains are global, not per-account), update the
# actual values below to match, not just in the dashboard, or the next push will
# reset it and break CORS again.
#
# Render's free Postgres expires 30 days after creation (14-day grace period, then
# deleted) — see README.md's Deployment section for what that means day to day.

databases:
  - name: resume-builder-db
    plan: free

services:
  - type: web
    name: resume-builder-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    # Migrations run as part of the container's own CMD (see backend/Dockerfile)
    # rather than via Render's `preDeployCommand` — that field is a paid-plan-only
    # feature, and this project targets the free tier.
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: resume-builder-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://resume-builder-frontend-4j43.onrender.com

  - type: web
    name: resume-builder-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://resume-builder-backend-ghpy.onrender.com
