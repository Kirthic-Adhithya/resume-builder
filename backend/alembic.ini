[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url is intentionally omitted here — alembic/env.py reads it from
# app.core.config.Settings at runtime so migrations always use the same DATABASE_URL
# as the running app, instead of a second, easily-out-of-sync copy in this file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
