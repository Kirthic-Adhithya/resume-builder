services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    # The image's own CMD (in backend/Dockerfile) is the production command — no
    # --reload, honors $PORT. Local dev overrides it here to add --reload, since the
    # source is bind-mounted below and we want file changes to restart the server.
    #
    # Still chains `alembic upgrade head` first, same as the production CMD — a
    # brand new clone's postgres_data volume starts with zero tables, so without
    # this, the very first `docker compose up` looks like it's working (both
    # containers report healthy) right up until someone tries to register and hits
    # a 500 from a missing `users` table. Harmless no-op once already at head.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    # Bound to 127.0.0.1 explicitly, not the default 0.0.0.0: Docker Desktop on Windows
    # can accept IPv6 (::1) loopback connections to a published port without actually
    # forwarding them, so a client that prefers IPv6 (many browsers, curl's Happy
    # Eyeballs) hangs indefinitely instead of failing fast or connecting. Binding only
    # the IPv4 loopback address means an IPv6 attempt gets a hard "connection refused"
    # instead of a silent hang. See DECISIONS.md ADR-009.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
